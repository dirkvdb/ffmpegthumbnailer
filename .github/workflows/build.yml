name: Build

on: [push]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true


      - name: Build with Nix
        run: nix build .#default

      - name: Static build
        run: nix build .#static

      - name: Windows build
        if: matrix.os == 'ubuntu-latest'
        run: nix build .#windows

      - name: Run tests with Nix
        run: nix flake check

      - name: Upload builds to Cloudsmith
        env:
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
        run: |
          if [ -z "$CLOUDSMITH_TOKEN" ]; then
            echo "Skipping cache upload: CLOUDSMITH_TOKEN is not configured."
            exit 0
          fi
          umask 077
          netrc="$RUNNER_TEMP/cloudsmith.netrc"
          trap 'rm -f "$netrc"' EXIT
          printf 'machine nix.cloudsmith.io\nlogin token\npassword %s\n' "$CLOUDSMITH_TOKEN" > "$netrc"
          nix copy --option netrc-file "$netrc" --no-check-sigs \
            --to 'https://nix.cloudsmith.io/open-source/ffmpegthumbnailer?compression=zstd' \
            .#default .#static
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            nix copy --option netrc-file "$netrc" --no-check-sigs \
              --to 'https://nix.cloudsmith.io/open-source/ffmpegthumbnailer?compression=zstd' \
              .#windows
          fi
