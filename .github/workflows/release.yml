name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        run: |
          gh release create ${{ steps.tag.outputs.tag_name }} \
            --title "Release ${{ steps.tag.outputs.tag_name }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true


      - name: Build
        run: nix build .#static -o release

      - name: Windows build
        if: matrix.os == 'ubuntu-latest'
        run: nix build .#windows -o release_win

      - name: Upload builds to Cloudsmith
        env:
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
        run: |
          if [ -z "$CLOUDSMITH_TOKEN" ]; then
            echo "Skipping cache upload: CLOUDSMITH_TOKEN is not configured."
            exit 0
          fi
          umask 077
          netrc="$RUNNER_TEMP/cloudsmith.netrc"
          trap 'rm -f "$netrc"' EXIT
          printf 'machine nix.cloudsmith.io\nlogin token\npassword %s\n' "$CLOUDSMITH_TOKEN" > "$netrc"
          nix copy --option netrc-file "$netrc" --no-check-sigs \
            --to 'https://nix.cloudsmith.io/open-source/ffmpegthumbnailer?compression=zstd' \
            .#static
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            nix copy --option netrc-file "$netrc" --no-check-sigs \
              --to 'https://nix.cloudsmith.io/open-source/ffmpegthumbnailer?compression=zstd' \
              .#windows
          fi

      - name: Create archives and upload (Unix)
        run: |
          # Create individual archives for each tool
          for tool in ffmpegthumbnailer; do
            mkdir -p ${tool}-temp
            cp release/bin/${tool} ${tool}-temp/
            tar -czf ${tool}-${{ matrix.artifact_name }}.tar.gz -C ${tool}-temp ${tool}
            rm -rf ${tool}-temp
            gh release upload ${{ needs.create-release.outputs.tag_name }} ${tool}-${{ matrix.artifact_name }}.tar.gz
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and upload Windows cross compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Create individual archives for each tool
          for tool in ffmpegthumbnailer; do
            mkdir -p ${tool}-temp
            cp release_win/bin/${tool}.exe ${tool}-temp/
            zip -j ${tool}-windows-mingw64.zip ${tool}-temp/${tool}.exe
            rm -rf ${tool}-temp
            gh release upload ${{ needs.create-release.outputs.tag_name }} ${tool}-windows-mingw64.zip
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
